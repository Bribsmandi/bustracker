[project]
name = "bustracker-server"
version = "2.0.0"
description = "Campus Bus Tracker: processor and API for the Raspberry Pi backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "paho-mqtt>=2.1",
    "pydantic>=2.8",
]

[project.optional-dependencies]
push = ["google-auth>=2.30", "requests>=2.32"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
