# /etc/mosquitto/conf.d/campus.conf
#
# Runs on the public VM alongside relay.py, and is the single hub for the whole
# system:
#
#   relay.py  (localhost) --publish--> campus/bus/{id}/gps
#   Pi        (internet)  --subscribe-> campus/bus/+/gps
#   Pi        (internet)  --publish---> campus/live/#
#   phones    (internet)  --subscribe-> campus/live/#
#
# The Pi is behind campus NAT and cannot be dialled into, which is why the broker
# lives here and the Pi connects outward as a client.

persistence true
persistence_location /var/lib/mosquitto/

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true

# Native MQTT: the relay (over loopback) and the Pi processor.
listener 1883
protocol mqtt

# WebSocket: Flutter web, and mobile clients on networks that only allow 443.
listener 9001
protocol websockets

# Keep a lid on it. The live snapshot is a few hundred bytes; nothing here has
# any reason to send a large message.
message_size_limit 65536
max_queued_messages 200
